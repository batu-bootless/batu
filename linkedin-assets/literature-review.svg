<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#23445B"/></linearGradient></defs><rect width="1200" height="627" rx="28" fill="url(#b)"/><circle cx="1000" cy="300" r="210" fill="#60A5FA" opacity=".09"/><g transform="translate(830 140)" fill="none" stroke="#A5F3FC" stroke-width="7" stroke-linejoin="round"><path d="M0 20Q70 -5 140 20V260Q70 235 0 260Z"/><path d="M140 20Q210 -5 280 20V260Q210 235 140 260Z"/><path d="M25 70h85M25 105h85M25 140h70M165 70h85M165 105h85M165 140h70"/></g><text x="76" y="92" fill="#67E8F9" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">RESEARCH METHODS</text><text x="76" y="190" fill="#FFF" font-family="Arial" font-size="55" font-weight="700">Read beyond the abstract.</text><text x="78" y="253" fill="#DCEAF4" font-family="Arial" font-size="27">Literatür taramasında özeti aş.</text><rect x="78" y="304" width="600" height="2" fill="#67E8F9"/><text x="78" y="356" fill="#E5F3F8" font-family="Arial" font-size="22">Compare methods, sample sizes and limitations.</text><text x="78" y="394" fill="#E5F3F8" font-family="Arial" font-size="22">Look for evidence that agrees — and conflicts.</text><text x="78" y="432" fill="#E5F3F8" font-family="Arial" font-size="22">Yöntemleri, örneklemi ve sınırlılıkları karşılaştır.</text><text x="78" y="470" fill="#E5F3F8" font-family="Arial" font-size="22">Hem örtüşen hem çelişen bulguları ara.</text><text x="78" y="575" fill="#91AFC1" font-family="Arial" font-size="16">@batu.targay</text></svg>