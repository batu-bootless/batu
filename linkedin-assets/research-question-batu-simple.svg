<text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1767a8" letter-spacing="3">ARAŞTIRMA NOTLARI  /  RESEARCH NOTES</text>
<text x="64" y="145" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#132b45">Araştırma sorusunu</text>
<text x="64" y="202" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#132b45">ölçülebilir hâle getirmek</text>
<text x="66" y="246" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#52677c">Turning a question into a measurable research question</text>
