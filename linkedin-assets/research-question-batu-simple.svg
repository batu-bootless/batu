<rect x="338" y="288" width="252" height="184" rx="14" fill="#ffffff" stroke="#d6e2ed" stroke-width="2"/>
<rect x="612" y="288" width="252" height="184" rx="14" fill="#ffffff" stroke="#d6e2ed" stroke-width="2"/>
<rect x="886" y="288" width="250" height="184" rx="14" fill="#ffffff" stroke="#d6e2ed" stroke-width="2"/>
<circle cx="94" cy="324" r="13" fill="#1767a8"/><text x="94" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="116" y="330" font-family="Arial" font-size="22" font-weight="700" fill="#132b45">SORU</text>
<text x="86" y="374" font-family="Arial" font-size="18" fill="#52677c"><tspan x="86" dy="0">Ne araştırılıyor?</tspan><tspan x="86" dy="27">Kirletici ve adsorbanı</tspan><tspan x="86" dy="27">açıkça tanımla.</tspan></text>
<circle cx="368" cy="324" r="13" fill="#1767a8"/><text x="368" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="390" y="330" font-family="Arial" font-size="22" font-weight="700" fill="#132b45">DEĞİŞKENLER</text>
<text x="360" y="374" font-family="Arial" font-size="18" fill="#52677c"><tspan x="360" dy="0">pH, derişim, süre</tspan><tspan x="360" dy="27">ve yanıt değişkenini</tspan><tspan x="360" dy="27">belirle.</tspan></text>
<circle cx="642" cy="324" r="13" fill="#1767a8"/><text x="642" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">3</text>
<text x="664" y="330" font-family="Arial" font-size="22" font-weight="700" fill="#132b45">YÖNTEM</text>
<text x="634" y="374" font-family="Arial" font-size="18" fill="#52677c"><tspan x="634" dy="0">Cihazı, yöntemi ve</tspan><tspan x="634" dy="27">kontrol koşullarını</tspan><tspan x="634" dy="27">önceden yaz.</tspan></text>
<circle cx="916" cy="324" r="13" fill="#1767a8"/><text x="916" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">4</text>
<text x="938" y="330" font-family="Arial" font-size="22" font-weight="700" fill="#132b45">VERİ</text>
<text x="908" y="374" font-family="Arial" font-size="18" fill="#52677c"><tspan x="908" dy="0">Ölçüm birimini</tspan><tspan x="908" dy="27">ve başarı ölçütünü</tspan><tspan x="908" dy="27">netleştir.</tspan></text>
<line x1="64" y1="520" x2="1136" y2="520" stroke="#cbd9e6" stroke-width="2"/>
<text x="64" y="558" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52677c">Net soru  •  Ölçülebilir değişken  •  Tekrarlanabilir yöntem</text>
<text x="1136" y="582" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1767a8">@batu.targay</text>
