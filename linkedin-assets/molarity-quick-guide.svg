<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#174E5A"/></linearGradient></defs><rect width="1200" height="627" rx="28" fill="url(#b)"/><text x="76" y="92" fill="#5EEAD4" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">ANALYTICAL CHEMISTRY</text><text x="76" y="180" fill="#FFF" font-family="Arial" font-size="58" font-weight="700">Molarity, made clear.</text><text x="78" y="239" fill="#D7EAF0" font-family="Arial" font-size="27">Molariteyi netleştirelim.</text><rect x="76" y="290" width="650" height="125" rx="20" fill="#FFFFFF" opacity=".09" stroke="#99F6E4" stroke-opacity=".65"/><text x="108" y="340" fill="#FFF" font-family="Arial" font-size="28">M = moles of solute / solution volume (L)</text><text x="108" y="384" fill="#99F6E4" font-family="Arial" font-size="24">M = n / V</text><text x="78" y="470" fill="#E0F2FE" font-family="Arial" font-size="22">Example: 0.50 mol in 2.0 L → 0.25 mol/L</text><text x="78" y="510" fill="#E0F2FE" font-family="Arial" font-size="22">Örnek: 2,0 L çözeltide 0,50 mol → 0,25 mol/L</text><g transform="translate(875 265)"><path d="M35 0h100M55 0v65L15 180q-14 35 25 35h90q39 0 25-35L115 65V0" fill="none" stroke="#D1FAF5" stroke-width="8" stroke-linecap="round"/><path d="M39 145h92l24 42q5 12-13 12H28q-18 0-12-12z" fill="#2DD4BF" opacity=".75"/><circle cx="63" cy="166" r="6" fill="#ECFEFF"/><circle cx="101" cy="183" r="5" fill="#ECFEFF"/><circle cx="92" cy="157" r="4" fill="#ECFEFF"/></g><text x="78" y="575" fill="#8FB4C6" font-family="Arial" font-size="16">@batu.targay</text></svg>