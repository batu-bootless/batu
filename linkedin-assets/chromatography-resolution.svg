<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1B2A"/><stop offset="1" stop-color="#184A55"/></linearGradient></defs><rect width="1200" height="627" rx="28" fill="url(#b)"/><text x="76" y="92" fill="#5EEAD4" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">CHROMATOGRAPHY</text><text x="76" y="182" fill="#FFF" font-family="Arial" font-size="55" font-weight="700">Two peaks. Can you separate them?</text><text x="78" y="242" fill="#D6F0EF" font-family="Arial" font-size="27">İki pik: birbirinden ayrılabiliyor mu?</text><g transform="translate(95 300)"><path d="M0 160H620" stroke="#D8F5F2" stroke-width="3"/><path d="M25 160C60 160 70 155 90 115C110 70 120 35 140 35C165 35 180 120 200 151C220 160 235 160 260 160C290 160 305 150 330 100C350 58 365 43 385 43C410 43 430 128 450 153C475 160 510 160 610 160" fill="none" stroke="#5EEAD4" stroke-width="5"/><path d="M140 35V160M385 43V160" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6" opacity=".6"/></g><text x="780" y="355" fill="#FFF" font-family="Arial" font-size="25" font-weight="700">Resolution depends on</text><text x="780" y="398" fill="#D6F0EF" font-family="Arial" font-size="21">retention, selectivity</text><text x="780" y="432" fill="#D6F0EF" font-family="Arial" font-size="21">and peak broadening.</text><text x="780" y="478" fill="#99F6E4" font-family="Arial" font-size="20">Alıkonma • seçicilik • pik genişliği</text><text x="78" y="575" fill="#8FB4C6" font-family="Arial" font-size="16">@batu.targay</text></svg>