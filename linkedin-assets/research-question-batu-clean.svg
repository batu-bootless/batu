<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset=".62" stop-color="#eaf6fc"/><stop offset="1" stop-color="#c9eafa"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087bdc"/><stop offset="1" stop-color="#31c0ef"/></linearGradient>
 <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#61d7ff" stop-opacity=".45"/><stop offset="1" stop-color="#087fd5" stop-opacity=".88"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#164f78" flood-opacity=".13"/></filter>
 <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#8bb9d3" stroke-opacity=".18"/></pattern>
</defs>
<rect width="1200" height="627" fill="url(#bg)"/>
<!-- soft lab shapes -->
<circle cx="1040" cy="90" r="185" fill="#ffffff" opacity=".72"/><circle cx="1100" cy="500" r="180" fill="#8bdfff" opacity=".18"/>
<g opacity=".28" stroke="#72a7c6" stroke-width="2"><path d="M890 0v270m55-270v240m130-240v235"/><path d="M825 278h360"/></g>
<!-- microscope silhouette -->
<g transform="translate(1045 90)" opacity=".3" fill="#315e7a"><path d="M30 0h54v18H30zM50 18h16v45H50zM49 63l38 37-13 13-39-38zM72 109l24 20-9 17-29-24z"/><rect x="36" y="142" width="95" height="12" rx="6"/><path d="M58 154h18v62H58zM31 211h83v16H31z"/><path d="M5 230h138v18H5z"/><circle cx="76" cy="225" r="27" fill="none" stroke="#315e7a" stroke-width="8"/></g>
<!-- header -->
<text x="50" y="43" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="4" font-weight="700" fill="#42647b">KİMYA  •  ARAŞTIRMA  •  EĞİTİM  •  BİLİM</text>
<rect x="965" y="24" width="190" height="43" rx="22" fill="#ffffff" stroke="#a7c5d8" stroke-width="1.5"/>
<circle cx="990" cy="45" r="10" fill="none" stroke="#163f5c" stroke-width="2"/><path d="M980 57q10-14 20 0" fill="none" stroke="#163f5c" stroke-width="2"/>
<text x="1010" y="51" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#163f5c">@batu.targay</text>
<!-- main typography -->
<text x="50" y="123" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" fill="#102f49">Araştırma sorusunu</text>
<text x="50" y="173" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" fill="url(#blue)">ölçülebilir hâle getirmek</text>
<text x="53" y="209" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#284c65">İyi bir araştırma sorusu; net, ölçülebilir ve test edilebilir olmalıdır.</text>
<rect x="53" y="225" width="70" height="5" rx="3" fill="url(#blue)"/>
<!-- four clean cards -->
<g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)">
 <g transform="translate(50 252)"><rect width="190" height="200" rx="18" fill="#ffffff" fill-opacity=".94" stroke="#d0e5f1"/><circle cx="26" cy="27" r="15" fill="url(#blue)"/><text x="26" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><circle cx="95" cy="69" r="37" fill="#e3f5ff"/><path d="M95 48v22m-11-8a11 11 0 1 1 22 0c0 7-5 9-6 15H90c-1-6-6-8-6-15m7 22h8" fill="none" stroke="#0877bd" stroke-width="3" stroke-linecap="round"/><text x="95" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="#163c59">SORU</text><text x="95" y="147" text-anchor="middle" font-size="14" fill="#294d66">Net bir problem</text><text x="95" y="166" text-anchor="middle" font-size="14" fill="#294d66">belirle</text></g>
 <g transform="translate(255 252)"><rect width="190" height="200" rx="18" fill="#ffffff" fill-opacity=".94" stroke="#d0e5f1"/><circle cx="26" cy="27" r="15" fill="url(#blue)"/><text x="26" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><circle cx="95" cy="69" r="37" fill="#e3f5ff"/><rect x="77" y="49" width="36" height="43" rx="4" fill="none" stroke="#0877bd" stroke-width="3"/><path d="M86 45h18v9H86zM84 65l5 5 8-9m-13 18 5 5 8-9" fill="none" stroke="#0877bd" stroke-width="3"/><text x="95" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="#163c59">DEĞİŞKENLER</text><text x="95" y="147" text-anchor="middle" font-size="14" fill="#294d66">Ölçülebilir</text><text x="95" y="166" text-anchor="middle" font-size="14" fill="#294d66">parametreleri tanımla</text></g>
 <g transform="translate(460 252)"><rect width="190" height="200" rx="18" fill="#ffffff" fill-opacity=".94" stroke="#d0e5f1"/><circle cx="26" cy="27" r="15" fill="#655ce8"/><text x="26" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><circle cx="95" cy="69" r="37" fill="#efefff"/><path d="M83 47h24v7l-5 8v26q0 8-7 8t-7-8V62l-5-8z" fill="none" stroke="#315f9b" stroke-width="3"/><path d="M88 75h14v12q0 6-7 6t-7-6z" fill="url(#liquid)"/><text x="95" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="#163c59">YÖNTEM</text><text x="95" y="147" text-anchor="middle" font-size="14" fill="#294d66">Uygun deney</text><text x="95" y="166" text-anchor="middle" font-size="14" fill="#294d66">tasarımını seç</text></g>
 <g transform="translate(665 252)"><rect width="190" height="200" rx="18" fill="#ffffff" fill-opacity=".94" stroke="#d0e5f1"/><circle cx="26" cy="27" r="15" fill="#17aab8"/><text x="26" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><circle cx="95" cy="69" r="37" fill="#e2fbfb"/><path d="M75 91V73h11v18m7 0V59h11v32m7 0V48h11v43" fill="none" stroke="#078ca8" stroke-width="4" stroke-linejoin="round"/><text x="95" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="#163c59">VERİ</text><text x="95" y="147" text-anchor="middle" font-size="14" fill="#294d66">Analiz et</text><text x="95" y="166" text-anchor="middle" font-size="14" fill="#294d66">ve sonuçlandır</text></g>
</g>
<!-- glassware in right half -->
<g stroke="#8ecce9" stroke-width="3" fill="#ffffff" fill-opacity=".65">
 <path d="M925 245h48v17l-8 14v97q0 22-16 22t-16-22v-97l-8-14z"/>
 <path d="M935 315h28v58q0 15-14 15t-14-15z" fill="url(#liquid)" stroke="none"/>
 <path d="M1005 277h38v15l-7 13v68q0 18-12 18t-12-18v-68l-7-13z"/>
 <path d="M1013 326h22v46q0 13-11 13t-11-13z" fill="url(#liquid)" stroke="none"/>
 <path d="M1072 300h32v13l-6 12v54q0 16-10 16t-10-16v-54l-6-12z"/>
 <path d="M1079 340h18v39q0 12-9 12t-9-12z" fill="url(#liquid)" stroke="none"/>
</g>
<!-- checklist panel -->
<g filter="url(#shadow)">
 <rect x="875" y="388" width="280" height="166" rx="18" fill="#ffffff" stroke="#d0e5f1"/>
 <rect x="891" y="404" width="248" height="134" rx="8" fill="url(#paper)"/>
 <text x="895" y="425" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#173c58">Araştırma kontrol listesi</text>
 <g font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#254b66">
  <rect x="896" y="441" width="14" height="14" rx="3" fill="#fff" stroke="#158bd0" stroke-width="2"/><path d="M899 448l4 4 7-9" fill="none" stroke="#158bd0" stroke-width="2"/><text x="919" y="453">Net</text>
  <rect x="896" y="465" width="14" height="14" rx="3" fill="#fff" stroke="#158bd0" stroke-width="2"/><path d="M899 472l4 4 7-9" fill="none" stroke="#158bd0" stroke-width="2"/><text x="919" y="477">Ölçülebilir</text>
  <rect x="896" y="489" width="14" height="14" rx="3" fill="#fff" stroke="#158bd0" stroke-width="2"/><path d="M899 496l4 4 7-9" fill="none" stroke="#158bd0" stroke-width="2"/><text x="919" y="501">Test edilebilir</text>
  <rect x="896" y="513" width="14" height="14" rx="3" fill="#fff" stroke="#158bd0" stroke-width="2"/><path d="M899 520l4 4 7-9" fill="none" stroke="#158bd0" stroke-width="2"/><text x="919" y="525">Özgün ve anlamlı</text>
 </g>
</g>
<!-- footer -->
<path d="M50 482H855" stroke="#a4cfe3" stroke-width="1.5"/>
<text x="52" y="516" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#2474a0">KİMYA  •  ARAŞTIRMA  •  DENEY  •  VERİ ANALİZİ</text>
<text x="52" y="548" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#365a70">Bir fikri, test edilebilir bir araştırma planına dönüştür.</text>
<text x="52" y="588" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#54758a">Bilimsel düşünme • Ölçüm • Analiz</text>
<text x="1148" y="590" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#153e5c">@batu.targay</text>
