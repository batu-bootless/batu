<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151B35"/><stop offset="1" stop-color="#25405A"/></linearGradient></defs><rect width="1200" height="627" rx="28" fill="url(#b)"/><text x="76" y="92" fill="#C4B5FD" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">LAB DATA • QUALITY</text><text x="76" y="182" fill="#FFF" font-family="Arial" font-size="55" font-weight="700">A result needs uncertainty.</text><text x="78" y="242" fill="#E3E6F7" font-family="Arial" font-size="27">Sonuç, belirsizlikle birlikte anlam kazanır.</text><rect x="76" y="293" width="660" height="2" fill="#C4B5FD"/><text x="78" y="350" fill="#F3F4F6" font-family="Arial" font-size="22">Report the value, unit and uncertainty.</text><text x="78" y="390" fill="#F3F4F6" font-family="Arial" font-size="22">Track significant figures and error sources.</text><text x="78" y="430" fill="#F3F4F6" font-family="Arial" font-size="22">Değeri, birimi ve belirsizliği birlikte yaz.</text><text x="78" y="470" fill="#F3F4F6" font-family="Arial" font-size="22">Anlamlı basamakları ve hata kaynaklarını izle.</text><g transform="translate(850 190)" fill="none" stroke="#C4B5FD" stroke-width="5"><path d="M0 120H270M20 70V170M250 70V170"/><path d="M20 120L65 70L110 140L155 50L200 95L250 120" stroke="#A5F3FC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155" cy="50" r="10" fill="#C4B5FD"/></g><text x="78" y="575" fill="#A4B0C8" font-family="Arial" font-size="16">@batu.targay</text></svg>